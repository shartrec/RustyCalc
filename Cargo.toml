[package]
name = "rusty_calc"
version = "0.1.0"
edition = "2021"
description = "An algebraic calculator with Graphical User Interface"
documentation = "https://docs.rs/preferences"
repository = "https://github.com/shartrec/RustyCalc"
readme = "README.md"
keywords = ["tool", "user", "gui"]
license = "MIT"

[dependencies]
floem = { git = "https://github.com/lapce/floem.git", branch = "main" }
home = "0.5.9"
log = "^0.4"
palette = "^0.7.6"
preferences = "2.0.0"
simplelog = "0.12.2"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
strum = { version = "0.26.3", features = ["derive"] }
strum_macros = "0.26.4"
